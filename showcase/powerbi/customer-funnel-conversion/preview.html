<script>
(function(){

  function fmt(n,type){if(type==="money")return "$"+Math.round(n/1000)+"K";if(type==="moneyExact")return "$"+Math.round(n).toLocaleString("en-US");if(type==="int")return Math.round(n).toLocaleString("en-US");return n.toFixed(1)+"%";}
  function metrics(){var s=summary(),risk=s.cvr<10,defaultLens=ids.every(function(id){return state[id]===({year:"2026",period:"May 2026",device:"All Devices",channel:"All Channels",region:"All Regions",scenario:"Base"})[id]});return[

    {l:"Net Revenue",v:fmt(s.revenue,"money"),d:defaultLens?fmt(s.revenue,"moneyExact")+" latest month":state.channel+" lens",risk:false},

  function lineSvg(vals,maxDomain,label){var pts=vals.map(function(v,i){return (15+i*(335/Math.max(1,vals.length-1)))+","+(130-Math.max(0,Math.min(maxDomain,v))/maxDomain*105)}).join(" ");return '<svg viewBox="0 0 360 150" role="img" aria-label="'+label+' under the selected global filters"><title>'+label+'</title><g class="gridline"><line x1="10" y1="25" x2="350" y2="25"/><line x1="10" y1="78" x2="350" y2="78"/><line x1="10" y1="130" x2="350" y2="130"/></g><polyline class="trendline" points="'+pts+'"/><text class="axis-label" x="10" y="147">Jun 25</text><text class="axis-label" x="315" y="147">May 26</text></svg>';}

  function geometryFingerprint(root){var raw=Array.prototype.map.call(root.querySelectorAll("svg polyline,svg path,svg rect,svg circle,.fill"),function(n){return[n.tagName,n.getAttribute("points"),n.getAttribute("d"),n.getAttribute("x"),n.getAttribute("y"),n.getAttribute("width"),n.getAttribute("height"),n.style.width,n.style.height].join("|")}).join(";"),h=2166136261;for(var i=0;i<raw.length;i++){h^=raw.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)+":"+raw.length}
  function channelTable(title){var tableRows=channelData.slice(0,5).concat([{name:"Referral + Affiliate",visits:1557,purchases:123,revenue:8909,opportunity:4462}]);return '<div class="panel full"><h3>'+title+'</h3><div class="sub">May 2026 aggregate; Referral + Affiliate are grouped; opportunity uses the 12% CVR guardrail</div><table><thead><tr><th>Channel</th><th class="num">Visits</th><th class="num">Purchases</th><th class="num">CVR</th><th class="num">Revenue</th><th class="num">Opportunity</th></tr></thead><tbody>'+tableRows.map(function(r){var selected=state.channel===r.name||(r.name==="Referral + Affiliate"&&(state.channel==="Referral"||state.channel==="Affiliate"));return '<tr'+(selected?' aria-current="true"':'')+'><td class="owner">'+r.name+'</td><td class="num">'+fmt(r.visits,"int")+'</td><td class="num">'+fmt(r.purchases,"int")+'</td><td class="num">'+(r.purchases/r.visits*100).toFixed(1)+'%</td><td class="num">'+fmt(r.revenue,"moneyExact")+'</td><td class="num '+(r.opportunity?"bad":"good")+'">'+fmt(r.opportunity,"moneyExact")+'</td></tr>'}).join("")+'</tbody></table></div>';}
  function categoryTable(){var rows=[["Apparel","Softlines","$3.9K","Landing-page match"],["Beauty","Consumables","$2.7K","Protect email CVR"],["Electronics","Hardlines","$5.4K","Fix product discovery"],["Home","Home","$3.1K","Reduce cart exits"],["Sports","Lifestyle","$4.0K","Review refund friction"]];return '<div class="panel full"><h3>Category intervention queue</h3><div class="sub">Compact modeled opportunity; values are non-additive diagnostics</div><table><thead><tr><th>Category</th><th>Owner</th><th class="num">Opportunity</th><th>Recommended next move</th></tr></thead><tbody>'+rows.map(function(r){return '<tr><td class="owner">'+r[0]+'</td><td>'+r[1]+'</td><td class="num bad">'+r[2]+'</td><td>'+r[3]+'</td></tr>'}).join("")+'</tbody></table></div>';}
  function actionTable(){var rows=[["Paid Social audiences","Social Growth","$10.4K","Stop / test"],["Affiliate partners","Partnerships","$4.2K","Renegotiate"],["Organic discovery","SEO","$4.2K","Optimize"],["Checkout friction","Product","Guardrail","Fix"]];return '<div class="panel full"><h3>Growth action detail</h3><div class="sub">Owner, value at stake, and controlled next action</div><table><thead><tr><th>Intervention</th><th>Owner</th><th class="num">Value at stake</th><th>Status</th></tr></thead><tbody>'+rows.map(function(r,i){return '<tr><td class="owner">'+r[0]+'</td><td>'+r[1]+'</td><td class="num">'+r[2]+'</td><td><span class="pill '+(i===0||i===1?"warn":"")+'">'+r[3]+'</span></td></tr>'}).join("")+'</tbody></table></div>';}

  function bind(){pageNav.querySelectorAll("[data-page]").forEach(function(b){b.onclick=function(){state.page=b.dataset.page;render()}});visuals.querySelectorAll("[data-channel]").forEach(function(b){b.onclick=function(){state.channel=b.dataset.channel;document.getElementById("channelFilter").value=state.channel;render()}})}
  ids.forEach(function(id){var el=document.getElementById(id+"Filter");el.onchange=function(){state[id]=el.value;render()}});
  document.getElementById("resetFilters").onclick=function(){state={page:pages[0].id,year:"2026",period:"May 2026",device:"All Devices",channel:"All Channels",region:"All Regions",scenario:"Base"};ids.forEach(function(id){document.getElementById(id+"Filter").value=state[id]});render()};
  function fit(){var frame=document.querySelector(".preview-frame"),shell=document.querySelector(".dashboard-shell"),dash=document.querySelector(".dashboard");if(frame.clientWidth<=720){dash.style.transform="none";shell.style.height=dash.offsetHeight+"px";return}var scale=Math.min(1,frame.clientWidth/dash.offsetWidth);dash.style.transform="scale("+scale+")";shell.style.height=Math.ceil(dash.offsetHeight*scale)+"px"}
  window.addEventListener("resize",fit);
  window.previewActions={setPage:function(id){if(pages.some(function(p){return p.id===id})){state.page=id;render()}return window.previewState},setFilter:function(kind,value){if(ids.indexOf(kind)>-1){state[kind]=value;var el=document.getElementById(kind+"Filter");if(el)el.value=value;render()}return window.previewState},resetFilters:function(){document.getElementById("resetFilters").click();return window.previewState},getSummary:function(){return metrics()},getRows:function(){return Array.prototype.map.call(visuals.querySelectorAll("tbody tr"),function(r){return r.innerText.trim()})}};
  render();
})();
</script>
