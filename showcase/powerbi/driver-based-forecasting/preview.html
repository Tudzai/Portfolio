<!doctype html>
<html lang="en" data-project-number="02" data-layout-source="project-02-own-dashboard">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Driver-Based Forecasting Interactive Preview</title>
  <link rel="canonical" href="index.html">
  <link rel="icon" href="../../../assets/favicon.svg">
  <style>
    :root {
      --canvas: #edf3f9;
      --panel: #ffffff;
      --panel-soft: #f7f9fc;
      --ink: #12233e;
      --muted: #53637b;
      --line: #d8e1ee;
      --line-strong: #c5d1e2;
      --navy: #0b2d59;
      --blue: #2259ad;
      --blue-light: #d7e5f8;
      --teal: #178f83;
      --teal-light: #d8efec;
      --amber: #d4921c;
      --amber-light: #f8ebc9;
      --violet: #6e4bd8;
      --violet-light: #e8e0fa;
      --rose: #be4655;
      --rose-light: #f5dde1;
      --shadow: 0 12px 28px rgba(27, 52, 89, .1);
      --shadow-soft: 0 5px 16px rgba(27, 52, 89, .07);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 0; background: var(--canvas); color: var(--ink); }
    body { font-family: "Segoe UI Variable", "Segoe UI", Arial, sans-serif; }
    button, select, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible {
      outline: 3px solid #0b5cab;
      outline-offset: 2px;
    }

    .preview-frame { width: 100%; overflow: hidden; background: var(--canvas); }
    .dashboard-shell { height: 720px; overflow: hidden; }
    .dashboard {
      width: 1280px;
      height: 720px;
      margin-inline: auto;
      overflow: hidden;
      transform-origin: 0 0;
      padding: 12px 16px 14px;
      background:
        radial-gradient(620px 250px at 96% -4%, rgba(45, 104, 190, .13), transparent 62%),
        var(--canvas);
    }

    .app-header {
      position: relative;
      min-height: 82px;
      display: grid;
      grid-template-columns: minmax(360px, 1fr) auto;
      align-items: center;
      gap: 24px;
      padding: 12px 14px 12px 18px;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(112deg, #0a2b57 0%, #174f94 65%, #1a639f 100%);
      box-shadow: 0 12px 26px rgba(14, 46, 88, .17);
      overflow: hidden;
    }
    .app-header::before,
    .app-header::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }
    .app-header::before {
      width: 320px;
      height: 180px;
      top: -105px;
      right: 310px;
      border-radius: 50%;
      background: rgba(87, 165, 232, .2);
    }
    .app-header::after {
      inset: 0;
      opacity: .18;
      background-image: linear-gradient(rgba(255,255,255,.18) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.18) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(90deg, transparent 28%, #000 78%, transparent);
    }
    .title-block, .filters { position: relative; z-index: 1; }

    .brandline {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
      color: rgba(255, 255, 255, .72);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .brandline .live {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 7px;
      border: 1px solid rgba(255, 255, 255, .23);
      border-radius: 999px;
      color: #d9fff9;
      letter-spacing: .08em;
    }

    .brandline .live::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #58d2bf;
      box-shadow: 0 0 0 4px rgba(88, 210, 191, .14);
    }

    .title-row { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
    .title-row h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.05;
      letter-spacing: -.025em;
      white-space: nowrap;
    }
    .page-count {
      color: rgba(255, 255, 255, .66);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .09em;
      white-space: nowrap;
    }
    .title-block p {
      margin: 5px 0 0;
      color: rgba(255, 255, 255, .74);
      font-size: 11px;
      line-height: 1.35;
    }

    .filters {
      display: grid;
      grid-template-columns: 112px 112px 132px 152px;
      gap: 6px;
      align-items: stretch;
    }
    .filters.lab-mode { grid-template-columns: 144px; }
    .filter {
      min-width: 0;
      padding: 5px 7px 4px;
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 8px;
      background: rgba(255, 255, 255, .96);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      line-height: 1.1;
      box-shadow: 0 4px 12px rgba(3, 29, 62, .1);
      transition: border-color .16s ease, background .16s ease, box-shadow .16s ease;
    }
    .filter:hover,
    .filter:focus-within {
      border-color: rgba(139, 207, 255, .86);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(91, 178, 235, .15), 0 5px 16px rgba(3, 29, 62, .14);
    }
    .filter.is-active {
      border-color: #87c9ee;
      background: #f1f8ff;
      box-shadow: inset 0 -2px #4b9ed0, 0 5px 14px rgba(3, 29, 62, .12);
    }
    .filter.is-active > span { color: #135d92; }
    .filter span { display: block; margin: 0 0 2px; }
    .filter.hidden { display: none; }
    .filter select {
      display: block;
      width: 100%;
      min-width: 0;
      padding: 1px 16px 1px 0;
      border: 0;
      color: var(--ink);
      background: transparent;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .command-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      margin: 8px 0 7px;
    }
    .pagebar {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 5px;
    }
    .pagebar button, .reset {
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .86);
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, background .15s ease, color .15s ease;
    }
    .pagebar button:hover, .reset:hover { transform: translateY(-1px); border-color: #aabbd1; }
    .pagebar button[aria-selected="true"] {
      border-color: var(--blue);
      color: #fff;
      background: var(--blue);
      box-shadow: 0 5px 12px rgba(34, 89, 173, .2);
    }
    .pagebar button[aria-selected="true"] span { color: #bfe0ff; }
    .reset {
      padding: 0 12px;
      color: #973847;
      background: #fff6f7;
      border-color: #edcbd1;
      white-space: nowrap;
    }

    .decision-band {
      position: relative;
      min-height: 34px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 11px;
      margin-bottom: 8px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, .76);
      box-shadow: var(--shadow-soft);
      font-size: 10px;
      overflow: hidden;
    }
    .decision-band::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: linear-gradient(180deg, var(--blue), var(--teal));
    }
    .lens {
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .lens span {
      padding: 3px 7px;
      border-radius: 999px;
      color: #194a84;
      background: var(--blue-light);
      font-weight: 800;
    }
    .lens span.lens-status { color: #17685f; background: #dff1ed; }
    .lens span.lens-status.risk { color: #9b3d49; background: #f7e0e4; }
    .decision-copy { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
    .decision-copy strong { color: var(--ink); }
    .decision-owner { color: #376b63; font-weight: 800; white-space: nowrap; }

    .kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px;
      margin-bottom: 9px;
    }
    .kpis.lab-mode { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .kpi {
      position: relative;
      min-height: 82px;
      overflow: hidden;
      padding: 10px 11px 9px 13px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: linear-gradient(145deg, #fff 60%, color-mix(in srgb, var(--accent, var(--blue)) 5%, #fff));
      box-shadow: var(--shadow-soft);
    }
    .kpi::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--accent, var(--blue));
    }
    .kpi-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .kpi-label {
      overflow: hidden;
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .kpi-index {
      color: var(--accent, var(--blue));
      font-size: 9px;
      font-weight: 900;
    }
    .kpi-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 68px;
      align-items: end;
      gap: 5px;
      margin-top: 4px;
    }
    .kpi strong {
      display: block;
      font-size: 22px;
      line-height: 1;
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .kpi svg { width: 68px; height: 24px; }
    .kpi small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.2;
    }
    .kpi small.good { color: #207267; }
    .kpi small.risk { color: #a93c4a; }

    .visual-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-template-rows: 224px 179px;
      gap: 9px;
      height: 412px;
    }
    .visual-grid.lab-mode { grid-template-rows: 105px 298px; }
    .panel {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--panel);
      box-shadow: var(--shadow-soft);
      animation: content-enter .2s ease-out both;
      transition: border-color .16s ease, box-shadow .16s ease;
    }
    .panel:nth-child(2) { animation-delay: 25ms; }
    .panel:nth-child(3) { animation-delay: 50ms; }
    .panel:nth-child(4) { animation-delay: 75ms; }
    @media (hover: hover) {
      .panel:hover { border-color: #bdcce0; box-shadow: 0 9px 22px rgba(27, 52, 89, .1); }
      .kpi:hover { border-color: #bdcce0; box-shadow: 0 8px 20px rgba(27, 52, 89, .1); }
    }
    .panel::after {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 1px;
      background: linear-gradient(90deg, rgba(34,89,173,.22), transparent 58%);
      pointer-events: none;
    }
    .panel.span-3 { grid-column: span 3; }
    .panel.span-4 { grid-column: span 4; }
    .panel.span-5 { grid-column: span 5; }
    .panel.span-6 { grid-column: span 6; }
    .panel.span-7 { grid-column: span 7; }
    .panel.span-8 { grid-column: span 8; }
    .panel.span-12 { grid-column: span 12; }
    .panel-heading {
      display: flex;
      flex: 0 0 auto;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }
    .panel h2 {
      min-width: 0;
      margin: 0;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.2;
      letter-spacing: -.01em;
    }
    .panel-sub {
      margin: 3px 0 6px;
      color: #596980;
      font-size: 9.5px;
      line-height: 1.25;
    }
    .panel-action {
      flex: 0 0 auto;
      padding: 2px 6px;
      border: 1px solid #d4e2f2;
      border-radius: 999px;
      color: var(--blue);
      background: #f4f8fd;
      font-size: 9px;
      font-weight: 800;
      line-height: 1.1;
      white-space: nowrap;
    }

    .chart-wrap {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      height: auto;
      min-height: 0;
    }
    .chart { display: block; flex: 1 1 auto; width: 100%; height: 100%; min-height: 0; overflow: visible; }
    .chart text { font-family: "Segoe UI Variable", "Segoe UI", Arial, sans-serif; }
    .chart .gridline { stroke: #e4eaf2; stroke-width: 1; }
    .chart .axisline { stroke: #cbd6e4; stroke-width: 1; }
    .chart .tick { fill: #53657d; font-size: 12.5px; }
    .chart .direct-label { fill: #1d3150; font-size: 12.5px; font-weight: 800; }
    .chart .variance-category { fill: #1d3150; font-size: 16px; font-weight: 850; }
    .chart .variance-value {
      font-size: 17px;
      font-weight: 900;
      paint-order: stroke;
      stroke: #fff;
      stroke-width: 3px;
      stroke-linejoin: round;
    }
    .chart .variance-value.up { fill: #126f67; }
    .chart .variance-value.down { fill: #a33e4b; }
    .panel.span-3 .chart .tick { font-size: 17px; }
    .panel.span-3 .chart .direct-label { font-size: 17px; }
    .chart .empty-state { fill: #21456f; font-size: 15px; font-weight: 850; }
    .chart .empty-state-sub { fill: #53637b; font-size: 11px; }
    .chart .series-actual { fill: none; stroke: #697789; stroke-width: 2.1; }
    .chart .series-base { fill: none; stroke: var(--blue); stroke-width: 2.7; }
    .chart .series-upside { fill: none; stroke: var(--teal); stroke-width: 2.7; }
    .chart .series-downside { fill: none; stroke: var(--rose); stroke-width: 2.7; }
    .chart .series-ebitda { fill: none; stroke: var(--teal); stroke-width: 2.4; }
    .chart .scenario-mark { cursor: pointer; }
    .chart .scenario-mark:hover { opacity: .82; }
    .chart[tabindex="0"] { cursor: crosshair; }
    .chart[tabindex="0"]:focus-visible {
      outline: none;
      box-shadow: inset 0 0 0 2px #0b5cab;
      border-radius: 6px;
    }
    .chart .scenario-mark:focus-visible {
      outline: none;
      filter: drop-shadow(0 0 3px rgba(11, 92, 171, .95));
    }
    .chart .keyboard-active {
      filter: drop-shadow(0 0 4px rgba(34, 89, 173, .9));
    }

    .legend {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      align-self: flex-end;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 13px;
      margin: -1px 2px 3px 0;
      color: #53637b;
      font-size: 9.5px;
      pointer-events: none;
    }
    .legend span { display: inline-flex; align-items: center; gap: 4px; }
    .legend i { width: 14px; height: 4px; border-radius: 999px; background: var(--legend-color); }
    .legend i.legend-dash {
      height: 0;
      border-top: 2px dashed var(--legend-color);
      border-radius: 0;
      background: transparent;
    }
    .chart-readout {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      min-height: 19px;
      margin: 0 0 4px;
      padding: 2px 7px;
      overflow: hidden;
      border-left: 3px solid #4d83c3;
      border-radius: 5px;
      color: #29405d;
      background: #f1f6fc;
      font-size: 9.5px;
      font-variant-numeric: tabular-nums;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bar-list { display: grid; gap: 4px; margin-top: 8px; }
    .bar-list.is-focused { height: 100%; grid-template-rows: auto auto 1fr; }
    .bar-list .bar-readout { margin-bottom: 0; }
    .bar-context-note {
      display: flex;
      align-items: center;
      padding: 8px 9px;
      border: 1px dashed #c4d2e4;
      border-radius: 7px;
      color: #53637b;
      background: #f7f9fc;
      font-size: 9px;
      line-height: 1.35;
    }
    .bar-row {
      display: grid;
      grid-template-columns: minmax(80px, 1fr) minmax(90px, 2fr) 56px;
      align-items: center;
      gap: 7px;
      min-height: 20px;
      font-size: 9.5px;
    }
    .bar-row .bar-name {
      overflow: hidden;
      padding: 2px 0;
      color: #31425a;
      font-size: 9.5px;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bar-row-button {
      width: 100%;
      min-height: 24px;
      padding: 3px 4px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: background .15s ease, transform .15s ease;
    }
    .bar-row-button:hover { background: #f2f6fc; transform: translateX(2px); }
    .bar-row-button[aria-pressed="true"] {
      background: #eaf2ff;
      box-shadow: inset 3px 0 var(--blue);
    }
    .bar-row-button[aria-pressed="true"] .bar-name { color: var(--blue); font-weight: 900; }
    .bar-track { height: 10px; overflow: hidden; border-radius: 999px; background: #e8edf4; }
    .bar-fill {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--fill, var(--blue));
      transform-origin: left center;
      animation: grow-bar .28s ease-out both;
    }
    .bar-value { color: #263a55; font-weight: 850; text-align: right; font-variant-numeric: tabular-nums; }
    .empty-list {
      display: grid;
      place-items: center;
      min-height: 112px;
      margin-top: 8px;
      border: 1px dashed #cbd7e6;
      border-radius: 9px;
      color: var(--muted);
      background: #f8fafc;
      font-size: 9px;
      text-align: center;
    }

    .table-wrap { flex: 1 1 auto; width: 100%; height: auto; min-height: 0; overflow: auto; scrollbar-color: #9cafc7 #edf2f8; }
    .scroll-cue { display: none; }
    table { width: 100%; border-collapse: collapse; font-size: 9px; }
    th, td {
      padding: 1.5px 6px;
      border-bottom: 1px solid #e7ecf3;
      line-height: 1.1;
      text-align: left;
      vertical-align: middle;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      color: var(--muted);
      background: #f7f9fc;
      font-weight: 800;
      font-size: 9px;
    }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tbody tr:hover { background: #f2f7fd; }
    tbody tr[role="button"] { cursor: pointer; }
    tbody tr[role="button"][aria-pressed="true"] {
      background: #eaf2ff;
      box-shadow: inset 3px 0 var(--blue);
    }
    tbody tr[role="button"]:focus-visible {
      outline: 2px solid #0b5cab;
      outline-offset: -2px;
      background: #eef5ff;
    }
    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 45px;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 8.5px;
      font-weight: 850;
    }
    .status.good { color: #246a61; background: #dff1ed; }
    .status.watch { color: #855f19; background: #fbefcf; }
    .status.risk { color: #993c49; background: #f7e0e4; }

    .driver-list { display: grid; gap: 6px; margin-top: 6px; }
    .driver {
      display: grid;
      grid-template-columns: minmax(90px, 1fr) 68px 46px;
      align-items: center;
      gap: 7px;
      min-height: 24px;
      padding: 4px 6px;
      border-radius: 7px;
      background: #f7f9fc;
      font-size: 9px;
    }
    .driver strong { font-size: 9px; }
    .driver .impact { text-align: right; font-weight: 900; font-variant-numeric: tabular-nums; }
    .driver .impact.up { color: #236f65; }
    .driver .impact.down { color: #a53c49; }

    .lab-controls { display: grid; gap: 8px; margin-top: 8px; }
    .lab-controls.horizontal { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 6px; }
    .control {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) 44px;
      align-items: center;
      gap: 8px;
      min-height: 26px;
      font-size: 9px;
    }
    .control input { width: 100%; accent-color: var(--blue); cursor: pointer; }
    .control output {
      padding: 3px 5px;
      border-radius: 6px;
      color: #174b88;
      background: var(--blue-light);
      font-weight: 900;
      text-align: center;
    }

    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 7px; }
    .summary-item { padding: 7px; border-radius: 8px; background: #f6f8fb; }
    .summary-item span { display: block; color: var(--muted); font-size: 7px; }
    .summary-item strong { display: block; margin-top: 2px; font-size: 12px; }
    .readback-list { display: grid; gap: 6px; margin-top: 8px; }
    .readback-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 8px;
      background: #f6f8fb;
      font-size: 9px;
    }
    .readback-item span { color: var(--muted); }
    .readback-item strong { color: var(--ink); font-variant-numeric: tabular-nums; }

      function chartFrame(config) {

      function lineChart(series, options) {

        if (max === min) max = min + 1;
        var frame = chartFrame({
          leftLabels: [axisLabel(max, options.unit), axisLabel((max + min) / 2, options.unit), axisLabel(min, options.unit)],
          minLeft: 38,
          minRight: 14,

        });
        var left = frame.left, right = frame.right, top = frame.top, bottom = frame.bottom;

          '<line x1="' + left + '" y1="' + referenceY.toFixed(1) + '" x2="' + (width - right) + '" y2="' + referenceY.toFixed(1) + '" stroke="#d4921c" stroke-width="1.2" stroke-dasharray="5 4"></line>' +

        }).join("");

        var labelIndexes = [0, Math.floor((labels.length - 1) / 2), labels.length - 1].filter(function (value, index, array) { return array.indexOf(value) === index; });
        var xLabels = labelIndexes.map(function (index) {

          '<svg class="chart" role="img" aria-label="' + escapeHtml(options.ariaLabel) + '" viewBox="0 0 ' + width + " " + height + '">' +
          grid + reference + paths + '<line class="axisline" x1="' + left + '" y1="' + (height - bottom) + '" x2="' + (width - right) + '" y2="' + (height - bottom) + '"></line>' + xLabels +

      function comboChart() {
        var actualLabels = ["Jun 25", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec", "Jan 26", "Feb", "Mar", "Apr", "May 26"];

        }).join("");

        var points = ebitda.map(function (value, index) {

        }).join(" ");
        var dots = ebitda.map(function (value, index) {

        }).join("");
        var boundaryX = left + actualLabels.length * step;
        return '<div class="chart-wrap"><div class="legend"><span><i style="--legend-color:#2259ad"></i>' + escapeHtml(actualLabel) + '</span><span><i style="--legend-color:#8eafd5"></i>Forecast revenue</span><span><i style="--legend-color:#178f83"></i>Forecast EBITDA</span></div>' +
          '<svg class="chart" role="img" aria-label="Monthly revenue columns with EBITDA line" viewBox="0 0 560 172">' + grid + bars +

          '<polyline points="' + actualPoints + '" fill="none" stroke="#2259ad" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"></polyline>' + actualDots +

      function scenarioColumns(metric, title) {

            '<rect class="scenario-hit-area" aria-hidden="true" x="' + (left + group * index + group * .20).toFixed(1) + '" y="' + (top - 4) + '" width="' + (group * .60).toFixed(1) + '" height="' + (height - top + 2) + '" fill="transparent" style="pointer-events:all"></rect>' +
            '<rect x="' + x.toFixed(1) + '" y="' + (top + plotHeight - barHeight).toFixed(1) + '" width="' + (group * .46).toFixed(1) + '" height="' + barHeight.toFixed(1) + '" rx="4" fill="' + color + '" opacity="' + (active ? "1" : ".76") + '" stroke="' + (active ? "#0b2d59" : color) + '" stroke-width="' + (active ? "2" : ".7") + '"></rect>' +
            '<text class="direct-label" x="' + (x + group * .23).toFixed(1) + '" y="' + Math.max(top + 12, top + plotHeight - barHeight - 7).toFixed(1) + '" text-anchor="middle">' + valueLabel + '</text>' +

        return '<div class="chart-wrap"><svg class="chart" role="img" aria-label="' + escapeHtml(title + " by scenario; select a bar to change scenario") + '" viewBox="0 0 430 172">' +
          '<line class="gridline" x1="' + left + '" y1="' + (top + plotHeight) + '" x2="' + (width - right) + '" y2="' + (top + plotHeight) + '"></line>' + bars + '</svg></div>';
      }

      function divergingVariance() {
        var base = compute("Base"), upside = compute("Upside"), downside = compute("Downside");
        var rows = [
          ["Revenue", upside.revenue - base.revenue, downside.revenue - base.revenue],
          ["EBITDA", upside.ebitda - base.ebitda, downside.ebitda - base.ebitda],
          ["Ending cash", upside.cash - base.cash, downside.cash - base.cash]
        ];
        var max = Math.max.apply(null, rows.reduce(function (all, row) { return all.concat([Math.abs(row[1]), Math.abs(row[2])]); }, [])) || 1;
        var width = 430, height = 172, center = 268, maxBarWidth = 80, scale = maxBarWidth / max;
        var body = rows.map(function (row, index) {
          var y = 38 + index * 44, up = row[1] * currencyRate(), down = row[2] * currencyRate();
          var upWidth = Math.max(2, Math.abs(up) * scale);
          var downWidth = Math.max(2, Math.abs(down) * scale);
          var upEnd = center + upWidth;
          var downStart = center - downWidth;
          var upLabel = signedMoney(row[1]);
          var upLabelFits = upEnd + 6 + estimateSvgTextWidth(upLabel, 17) <= width - 8;
          var upLabelX = upLabelFits ? upEnd + 6 : width - 8;
          var upLabelY = upLabelFits ? y - 4 : y - 20;
          return '<text class="variance-category" x="8" y="' + (y + 4) + '">' + row[0] + '</text>' +
            '<line x1="145" y1="' + y + '" x2="' + (width - 8) + '" y2="' + y + '" stroke="#edf1f6" stroke-width="1"></line>' +
            '<rect tabindex="0" role="img" aria-label="' + escapeHtml(row[0] + " upside variance " + signedMoney(row[1])) + '" data-tip="' + escapeHtml(row[0] + " · Upside · " + signedMoney(row[1])) + '" x="' + center + '" y="' + (y - 11) + '" width="' + upWidth.toFixed(1) + '" height="9" rx="3" fill="#178f83"></rect>' +
            '<text class="variance-value up" x="' + upLabelX.toFixed(1) + '" y="' + upLabelY + '" text-anchor="' + (upLabelFits ? "start" : "end") + '">' + upLabel + '</text>' +
            '<rect tabindex="0" role="img" aria-label="' + escapeHtml(row[0] + " downside variance " + signedMoney(row[2])) + '" data-tip="' + escapeHtml(row[0] + " · Downside · " + signedMoney(row[2])) + '" x="' + downStart.toFixed(1) + '" y="' + (y + 3) + '" width="' + downWidth.toFixed(1) + '" height="9" rx="3" fill="#be4655"></rect>' +
            '<text class="variance-value down" x="' + Math.max(103, downStart - 6).toFixed(1) + '" y="' + (y + 11) + '" text-anchor="end">' + signedMoney(row[2]) + '</text>';

      function barList(titleRows, interactive, type) {

        return '<div class="bar-list' + (contextNote ? ' is-focused' : '') + '">' + readout + titleRows.map(function (row, index) {

      function serviceRows(metric) {

      function scatterChart() {

        });

      function workloadChart() {
        var labels = yearProfile[state.year].months;
        var fteValues = monthlySeries("fte");
        var payrollValues = monthlySeries("payroll");
        var width = 560, height = 172;
        var payrollMax = Math.max.apply(null, payrollValues.concat([1])) * 1.18;

          leftLabels: [money(payrollMax), money(payrollMax * .5), money(0)],

          minLeft: 42,
          minRight: 42,
          top: 18,
          bottom: 25
        });

        var plotWidth = width - left - right, plotHeight = height - top - bottom;
        var step = plotWidth / labels.length;
        function fteY(value) { return top + (fteMax - value) / Math.max(1, fteMax - fteMin) * plotHeight; }
        var grid = [0, .5, 1].map(function (ratio) {
          var y = top + plotHeight * ratio;
          var payrollValue = payrollMax * (1 - ratio);
          var fteValue = fteMax - (fteMax - fteMin) * ratio;

            '<text class="tick" x="' + (width - right + 5) + '" y="' + (y + 3).toFixed(1) + '">' + Math.round(fteValue) + '</text>';
        }).join("");
        var bars = payrollValues.map(function (value, index) {
          var x = left + index * step + step * .18;
          var barHeight = value / payrollMax * plotHeight;

        }).join("");
        var points = fteValues.map(function (value, index) {
          return (left + index * step + step * .46).toFixed(1) + "," + fteY(value).toFixed(1);

      function productivityChart() {
        var labels = yearProfile[state.year].months;
        var model = compute();
        var values = normalizedWeights(labels.length).map(function (weight, index) {
          return model.jobs / Math.max(1, model.fte) * (1 + (index - labels.length / 2) * .005);

      function cashSeries(scenarioName) {
        if (state.page !== "scenario-lab") return monthlySeries("cash", scenarioName);
        var labels = yearProfile[state.year].months;
        var labBaseLine = state.page === "scenario-lab" && scenarioName === "Base";
        var finalCash = labBaseLine ? scenarioLabBase().cash : compute(scenarioName).cash;
        var weights = normalizedWeights(labels.length, state.page === "scenario-lab" ? "Base" : scenarioName);
        var cumulative = 0;
        var openingReference = state.page === "scenario-lab" ? scenarioLabBase().cash : finalCash;
        return weights.map(function (weight, index) {
          cumulative += weight;
          var opening = Math.max(1.5, openingReference * .14);
          return opening + (finalCash - opening) * cumulative;
        });
      }

      function cashFlowChart() {

        var dots = endingCash.map(function (value, index) {

      function forecastAccuracyRows() {
        var services = ["Air Freight", "Ocean FCL", "Ocean LCL", "Contract Logistics", "Customs Brokerage", "Domestic Trucking"];
        var scenario = planningRecord(state.scenario);
        var regionFactor = regionProfile[state.region].factor;
        var rows = services.map(function (name, index) {
          var exact = accuracyProfile[name];
          var regionShift = state.region === "All Regions" ? 0 : (regionProfile[state.region].wave[(index * 2) % 12] - 1) * .35;
          return {
            service: name,
            mape: exact.mape + regionShift,
            bias: exact.bias + regionShift * .55,
            revenue: scenario.revenue * regionFactor * serviceProfile[name].factor
          };
        });
        return state.service === "All Services" ? rows : rows.filter(function (row) { return row.service === state.service; });
      }

      function exceptionRows() {
        var periodIndex = state.year === "2026" ? 1 : state.year === "2027" ? 2 : 0;
        var varianceRisk = state.scenario === "Downside" ? 2 : 0;
        var rows = exceptionFacts.map(function (fact) {
          var grossMargin = fact.gm[periodIndex];
          var marginRisk = grossMargin < 18 ? 2 : grossMargin < 20 ? 1 : 0;
          var accuracyRisk = fact.mape > 7.5 ? 2 : fact.mape > 6 ? 1 : 0;
          var score = marginRisk + accuracyRisk + varianceRisk;
          var owner = grossMargin < 18 ? "Commercial Finance" : fact.mape > 7.5 ? "Demand Planning" : state.scenario === "Downside" ? "Sales" : "FP&A";
          var action = grossMargin < 18 ? "Review price and direct-cost drivers" : fact.mape > 7.5 ? "Recalibrate forecast assumptions" : state.scenario === "Downside" ? "Build recovery plan" : "Monitor next cycle";
          return {
            region: fact.region,
            service: fact.service,
            exposure: fact.revenue[periodIndex],
            score: score,
            priority: score >= 4 ? "P1 - Act now" : score >= 2 ? "P2 - Review" : "Monitor",
            owner: owner,
            action: action,
            evidenceRank: fact.evidenceRank || 99
          };
        }).filter(function (row) { return row.score >= 2; });
        if (state.region !== "All Regions") rows = rows.filter(function (row) { return row.region === state.region; });
        if (state.service !== "All Services") rows = rows.filter(function (row) { return row.service === state.service; });
        var acceptedDefault = state.scenario === "Base" && state.year === "2026-2027" && state.region === "All Regions" && state.service === "All Services";
        return rows.sort(function (a, b) {
          return b.score - a.score || (acceptedDefault ? a.evidenceRank - b.evidenceRank : b.exposure - a.exposure);
        });
      }

      function statusClass(priority) {
        return priority === "P1 - Act now" ? "risk" : priority === "Monitor" ? "good" : "watch";
      }

      function exceptionTable(limit) {
        var rows = exceptionRows().slice(0, limit || 8);

            return '<tr><td>' + escapeHtml(row.region) + '</td><td>' + escapeHtml(row.service) + '</td><td class="num">' + money(row.exposure) + '</td><td class="num">' + row.score + '</td><td><span class="status ' + statusClass(row.priority) + '">' + row.priority + '</span></td><td>' + escapeHtml(row.owner) + '</td><td>' + escapeHtml(row.action) + '</td></tr>';

      function sensitivityImpactChart() {
        var labels = yearProfile[state.year].months;
        var weights = normalizedWeights(labels.length, "Base");
        var model = compute();
        var base = scenarioLabBase();
        var revenueImpact = weights.map(function (weight) { return (model.revenue - base.revenue) * weight; });
        var ebitdaImpact = weights.map(function (weight) { return (model.ebitda - base.ebitda) * weight; });
        var cumulativeWeight = 0;
        var cashImpact = weights.map(function (weight) {
          cumulativeWeight += weight;
          return (model.cash - base.cash) * cumulativeWeight;
        });
        var width = 560, height = 214, top = 20, bottom = 28;
        var neutral = state.volume === 0 && state.rate === 0 && state.cost === 0 && state.dso === 0;
        if (neutral) {
          var neutralLeft = 42, neutralRight = 18;
          var neutralPlotWidth = width - neutralLeft - neutralRight;
          var neutralStep = neutralPlotWidth / labels.length;
          var neutralTicks = labels.map(function (_, index) {
            var x = neutralLeft + neutralStep * index + neutralStep * .5;
            return '<line x1="' + x.toFixed(1) + '" y1="108" x2="' + x.toFixed(1) + '" y2="116" stroke="#c8d3e1" stroke-width="1"></line>';
          }).join("");
          return '<div class="chart-wrap"><div class="legend"><span><i style="--legend-color:#c6d9f2"></i>Revenue impact</span><span><i style="--legend-color:#178f83"></i>EBITDA impact</span><span><i style="--legend-color:#6e4bd8"></i>Cash impact</span></div>' +
            '<svg class="chart" role="img" aria-label="Neutral sensitivity baseline. Change an assumption to reveal monthly impact." viewBox="0 0 560 214">' +
            '<line x1="42" y1="112" x2="542" y2="112" stroke="#bdc9d8" stroke-width="1.5" stroke-dasharray="6 5"></line>' + neutralTicks +
            '<circle cx="292" cy="112" r="8" fill="#edf4fc" stroke="#2259ad" stroke-width="2"></circle>' +
            '<text class="empty-state" x="292" y="87" text-anchor="middle">Neutral Base plan</text>' +
            '<text class="empty-state-sub" x="292" y="145" text-anchor="middle">Move a driver to reveal monthly Revenue, EBITDA, and Cash impact</text>' +
            '</svg></div>';
        }
        var values = revenueImpact.concat(ebitdaImpact).concat(cashImpact).concat([0]);
        var max = Math.max.apply(null, values), min = Math.min.apply(null, values);
        var padding = Math.max(.25, (max - min) * .15);
        max += padding;
        min -= padding;
        var frame = chartFrame({
          leftLabels: [money(max), money((max + min) / 2), money(min)],
          minLeft: 42,
          minRight: 18,
          top: top,
          bottom: bottom
        });
        var left = frame.left, right = frame.right;
        var plotWidth = width - left - right, plotHeight = height - top - bottom;
        var step = plotWidth / labels.length;
        function y(value) { return top + (max - value) / (max - min || 1) * plotHeight; }
        var zeroY = y(0);
        var grid = [0, .5, 1].map(function (ratio) {
          var value = max - (max - min) * ratio;
          var yy = top + plotHeight * ratio;
          return '<line class="gridline" x1="' + left + '" y1="' + yy.toFixed(1) + '" x2="' + (width - right) + '" y2="' + yy.toFixed(1) + '"></line><text class="tick" x="' + (left - 5) + '" y="' + (yy + 3).toFixed(1) + '" text-anchor="end">' + money(value) + '</text>';
        }).join("");
        var bars = revenueImpact.map(function (value, index) {
          var x = left + index * step + step * .18;
          var valueY = y(value);
          return '<rect aria-hidden="true" x="' + x.toFixed(1) + '" y="' + Math.min(zeroY, valueY).toFixed(1) + '" width="' + Math.max(3, step * .55).toFixed(1) + '" height="' + Math.max(1, Math.abs(zeroY - valueY)).toFixed(1) + '" rx="2" fill="#b9d2ee" stroke="#83a9d4" stroke-width=".55" pointer-events="none"></rect>';
        }).join("");
        var ebitdaPoints = ebitdaImpact.map(function (value, index) {
          return (left + index * step + step * .46).toFixed(1) + "," + y(value).toFixed(1);
        }).join(" ");
        var ebitdaDots = ebitdaImpact.map(function (value, index) {
          var x = left + index * step + step * .46;
          return '<circle aria-hidden="true" cx="' + x.toFixed(1) + '" cy="' + y(value).toFixed(1) + '" r="3" fill="#178f83" stroke="#fff" stroke-width="1.2" pointer-events="none"></circle>';
        }).join("");
        var cashPoints = cashImpact.map(function (value, index) {
          return (left + index * step + step * .46).toFixed(1) + "," + y(value).toFixed(1);
        }).join(" ");
        var cashDots = cashImpact.map(function (value, index) {
          var x = left + index * step + step * .46;
          return '<circle aria-hidden="true" cx="' + x.toFixed(1) + '" cy="' + y(value).toFixed(1) + '" r="3.2" fill="#6e4bd8" stroke="#fff" stroke-width="1.2" pointer-events="none"></circle>';
        }).join("");
        var hitAreas = labels.map(function (label, index) {
          var x = left + index * step;
          var tip = label + " · Revenue " + signedMoney(revenueImpact[index]) + " · EBITDA " + signedMoney(ebitdaImpact[index]) + " · Cash " + signedMoney(cashImpact[index]);
          return '<rect tabindex="0" role="img" aria-label="' + escapeHtml(tip) + '" data-tip="' + escapeHtml(tip) + '" x="' + x.toFixed(1) + '" y="' + top + '" width="' + Math.max(8, step).toFixed(1) + '" height="' + plotHeight + '" fill="transparent" pointer-events="all"></rect>';
        }).join("");
        var xIndexes = [0, Math.floor((labels.length - 1) / 2), labels.length - 1];
        var xLabels = xIndexes.map(function (index) {
          var x = left + index * step + step * .46;
          return '<text class="tick" x="' + x.toFixed(1) + '" y="' + (height - 7) + '" text-anchor="' + (index === 0 ? "start" : index === labels.length - 1 ? "end" : "middle") + '">' + escapeHtml(labels[index]) + '</text>';
        }).join("");
        return '<div class="chart-wrap"><div class="legend"><span><i style="--legend-color:#83a9d4"></i>Revenue impact</span><span><i style="--legend-color:#178f83"></i>EBITDA impact</span><span><i style="--legend-color:#6e4bd8"></i>Cash impact</span></div><svg class="chart" role="img" aria-label="Monthly revenue, EBITDA, and cash sensitivity impact" viewBox="0 0 560 214">' + grid + '<line x1="' + left + '" y1="' + zeroY.toFixed(1) + '" x2="' + (width - right) + '" y2="' + zeroY.toFixed(1) + '" stroke="#8393a8" stroke-width="1.2"></line>' + bars + '<polyline points="' + ebitdaPoints + '" fill="none" stroke="#178f83" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"></polyline>' + ebitdaDots + '<polyline points="' + cashPoints + '" fill="none" stroke="#6e4bd8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"></polyline>' + cashDots + xLabels + hitAreas + '</svg></div>';
      }

      function renderLab() {
        var model = compute();
        var base = scenarioLabBase();
        var dsoImpact = scenarioLabDsoImpact();
        var controls = [
          ["volume", "Volume growth", -20, 20, 2, "%"],

          { name: "Volume impact", value: base.revenue * state.volume / 100, label: signedMoney(base.revenue * state.volume / 100) },
          { name: "Rate impact", value: base.revenue * (1 + state.volume / 100) * state.rate / 100, label: signedMoney(base.revenue * (1 + state.volume / 100) * state.rate / 100) },
          { name: "Cost impact", value: -base.directCost * (1 + state.volume / 100) * state.cost / 100, label: signedMoney(-base.directCost * (1 + state.volume / 100) * state.cost / 100) },
          { name: "DSO cash impact", value: dsoImpact, label: signedMoney(dsoImpact) }

        var controlHtml = '<div class="lab-controls horizontal">' + controls.map(function (control) {

        }).join("") + '</div>';
        var readback = '<div class="readback-list">' + [

          ["Cost", state.cost, "%", drivers[2].label],
          ["DSO", state.dso, "d", drivers[3].label]
        ].map(function (row) {
          return '<div class="readback-item"><span>' + row[0] + ' ' + (row[1] > 0 ? "+" : "") + row[1] + row[2] + '</span><strong>' + row[3] + '</strong></div>';
        }).join("") + '</div><div class="readback-total"><span>Adjusted plan</span><strong>' + money(model.cash) + ' ending cash</strong><small>' + money(model.revenue) + ' Revenue · ' + money(model.ebitda) + ' EBITDA · Base plan locked</small></div>';
        var floor = 40;
        var buffer = model.cash - floor;
        var neutral = state.volume === 0 && state.rate === 0 && state.cost === 0 && state.dso === 0;
        var margin = model.revenue ? model.ebitda / model.revenue * 100 : 0;
        var verdict = neutral ? "TEST" : buffer < 0 ? "HOLD" : margin < 10 ? "CHALLENGE" : model.cash < base.cash ? "REVIEW" : "VIABLE";
        var verdictCopy = neutral ? "Change an assumption to test the Base plan." : money(Math.abs(buffer)) + (buffer >= 0 ? " above" : " below") + " the $40M cash floor.";
        var verdictBody = '<div class="verdict-card' + (buffer < 0 || margin < 10 ? " risk" : "") + '"><b>Decision verdict</b><strong>' + verdict + '</strong><span>' + verdictCopy + '</span><div class="verdict-metrics">' +
          '<span><small>Cash buffer</small><b>' + signedMoney(buffer) + '</b></span>' +
          '<span><small>EBITDA vs Base</small><b>' + signedMoney(model.ebitda - base.ebitda) + '</b></span>' +
          '<span><small>Revenue vs Base</small><b>' + signedMoney(model.revenue - base.revenue) + '</b></span>' +
          '</div></div>';
        return panel("Assumption Controls", "Base plan locked · move a driver to recalculate the outcome", controlHtml, 12, "lab-control-panel", "Live") +
          panel("Monthly Sensitivity Impact", "Revenue columns with EBITDA and cash impact lines", sensitivityImpactChart(), 6, "chart-panel") +
          panel("Assumption Readback", "Current driver values and signed effects", readback, 3, "readback-panel") +
          panel("Decision", "Liquidity guardrail and planning call", verdictBody, 3, "verdict-panel");

          var scrollable = wrap.scrollWidth > wrap.clientWidth + 1;
          wrap.tabIndex = scrollable ? 0 : -1;
          if (scrollable) {
            wrap.setAttribute("aria-label", "Scrollable data table. Swipe or use arrow keys to view more columns.");

            cue.className = "scroll-cue";
            cue.setAttribute("aria-hidden", "true");
            cue.textContent = "Swipe table →";

          } else {
            wrap.removeAttribute("aria-label");

        });

      }

      function allChartMarks(chart) {
        return Array.prototype.slice.call(chart.querySelectorAll("[data-tip]"));
      }

      function setChartReadout(chart, text, announce) {
        var readout = chart.parentElement.querySelector(".chart-readout");
        if (readout) {
          readout.textContent = text;
          hideTooltip();
        }
        if (announce) document.getElementById("srStatus").textContent = text;
      }

      function setChartActiveMark(chart, index, announce) {
        var marks = chartMarks(chart);
        if (!marks.length) return;
        var nextIndex = Math.max(0, Math.min(index, marks.length - 1));
        marks.forEach(function (mark) { mark.classList.remove("keyboard-active"); });
        var mark = marks[nextIndex];
        mark.classList.add("keyboard-active");
        chart.dataset.activeMark = String(nextIndex);
        var text = mark.getAttribute("data-tip");
        var readout = chart.parentElement.querySelector(".chart-readout");
        if (readout) {
          setChartReadout(chart, text, announce);
        } else {
          positionTooltipForTarget(mark, text);
          if (announce) document.getElementById("srStatus").textContent = text;
        }
      }

      function enhanceChartKeyboard() {
        Array.prototype.forEach.call(document.querySelectorAll("svg.chart"), function (chart, chartIndex) {
          var allMarks = allChartMarks(chart);
          if (!allMarks.length) return;
          var marks = chartMarks(chart);
          var readout = document.createElement("div");
          readout.className = "chart-readout";
          readout.id = "chart-readout-" + state.page + "-" + chartIndex;
          readout.textContent = marks.length ? "Hover, tap, or use ← → to inspect exact values" : "Hover, tap, or Tab to inspect and select a scenario";
          chart.parentElement.insertBefore(readout, chart);
          chart.setAttribute("aria-describedby", readout.id);
          chart.dataset.inlineReadout = "true";

          if (!marks.length) return;
          marks.forEach(function (mark) { mark.setAttribute("tabindex", "-1"); });
          chart.setAttribute("tabindex", "0");
          chart.setAttribute("data-keyboard-chart", "true");
          chart.setAttribute("aria-roledescription", "interactive chart");
          var label = chart.getAttribute("aria-label") || "Interactive chart";
          if (label.indexOf("arrow keys") < 0) chart.setAttribute("aria-label", label + ". Use Left and Right arrow keys to inspect values.");
          chart.dataset.activeMark = "0";
        });
      }

      function updateContextControl() {
        var mode = contextMode();
        var label = document.getElementById("contextLabel");
        var select = document.getElementById("contextFilter");
        var options = mode === "department" ? departmentOptions : serviceOptions;
        var value = mode === "department" ? state.department : state.service;
        label.textContent = mode === "department" ? "Department" : "Service";
        select.setAttribute("aria-label", mode === "department" ? "Department" : "Service");
        select.innerHTML = options.map(function (option) { return '<option' + (option === value ? " selected" : "") + '>' + escapeHtml(option) + '</option>'; }).join("");
      }

      function updateFilterStates() {
        var labMode = state.page === "scenario-lab";
        var values = {
          scenarioControl: !labMode && state.scenario !== defaults.scenario,
          regionControl: !labMode && state.region !== defaults.region,
          contextControl: !labMode && (contextMode() === "department" ? state.department !== defaults.department : state.service !== defaults.service)
        };
        Object.keys(values).forEach(function (id) {
          var control = document.getElementById(id);
          if (control) control.classList.toggle("is-active", values[id]);
        });
        var yearControl = document.getElementById("yearFilter").closest(".filter");
        if (yearControl) yearControl.classList.toggle("is-active", state.year !== defaults.year);
      }

      function renderNavigation() {
        var activeIndex = pages.findIndex(function (page) { return page.id === state.page; });
        document.getElementById("pageNav").innerHTML = pages.map(function (page, index) {
          var active = page.id === state.page;
          return '<button type="button" role="tab" id="tab-' + page.id + '" aria-controls="visuals" aria-selected="' + active + '" tabindex="' + (active ? "0" : "-1") + '" data-page="' + page.id + '">' +
            '<span aria-hidden="true">0' + (index + 1) + '</span> ' + escapeHtml(page.short) + '</button>';
        }).join("");
        document.getElementById("pageCount").textContent = String(activeIndex + 1).padStart(2, "0") + " / 06";
      }

      function geometryFingerprint(root) {
        var selectors = "svg polyline,svg path,svg rect,svg circle,svg line,.bar-fill";
        var raw = Array.prototype.map.call(root.querySelectorAll(selectors), function (node) {
          return [
            node.tagName,
            node.getAttribute("points"),
            node.getAttribute("d"),
            node.getAttribute("x"),
            node.getAttribute("y"),
            node.getAttribute("x1"),
            node.getAttribute("y1"),
            node.getAttribute("x2"),
            node.getAttribute("y2"),
            node.getAttribute("width"),
            node.getAttribute("height"),
            node.getAttribute("cx"),
            node.getAttribute("cy"),
            node.getAttribute("r"),
            node.style.width,
            node.closest("[data-value]") ? node.closest("[data-value]").getAttribute("data-value") : ""
          ].join("|");
        }).join(";");
        var hash = 2166136261;
        for (var index = 0; index < raw.length; index += 1) {
          hash ^= raw.charCodeAt(index);
          hash = Math.imul(hash, 16777619);
        }
        return (hash >>> 0).toString(36) + ":" + root.querySelectorAll(selectors).length;
      }

      function publishQa() {
        var root = document.getElementById("visuals");
        var model = compute();
        window.previewState = Object.assign({}, state);
        window.__dashboardQa = {
          ready: true,
          projectNumber: "02",
          layoutSource: "project-02-own-dashboard",
          activePage: state.page,
          pageCount: pages.length,
          filterCount: state.page === "scenario-lab" ? 1 : 4,
          kpiCount: document.querySelectorAll(".kpi").length,
          panelCount: root.querySelectorAll(".panel").length,
          tableCount: root.querySelectorAll("table").length,
          chartFingerprint: geometryFingerprint(root),
          bodyOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 1,
          pnlTieOut: Math.abs(model.revenue - model.directCost - model.payroll - model.opex - model.ebitda) < .001,
          finiteValues: [model.revenue, model.directCost, model.payroll, model.ebitda, model.cash, model.mape].every(Number.isFinite)
        };
      }

      function fitDashboard() {
        var frame = document.querySelector(".preview-frame");
        var shell = document.querySelector(".dashboard-shell");
        var dashboard = document.querySelector(".dashboard");
        if (frame.clientWidth <= 1180) {
          dashboard.style.transform = "none";
          shell.style.height = dashboard.offsetHeight + "px";
          return;
        }
        var scale = Math.min(1, frame.clientWidth / 1280);
        dashboard.style.transform = "scale(" + scale + ")";
        shell.style.height = Math.ceil(720 * scale) + "px";
      }

      function render(announce) {
        hideTooltip();
        var page = pages.find(function (item) { return item.id === state.page; });
        var labMode = state.page === "scenario-lab";
        document.getElementById("dashboard").dataset.page = state.page;
        if (labMode) {
          state.scenario = "Base";
          document.getElementById("scenarioFilter").value = "Base";
        }
        document.getElementById("scenarioControl").classList.toggle("hidden", labMode);
        document.getElementById("regionControl").classList.toggle("hidden", labMode);
        document.getElementById("contextControl").classList.toggle("hidden", labMode);
        document.querySelector(".filters").classList.toggle("lab-mode", labMode);
        document.getElementById("pageTitle").textContent = page.label;
        document.getElementById("subtitle").textContent = page.sub;
        updateContextControl();
        updateFilterStates();
        renderNavigation();
        document.getElementById("visuals").setAttribute("aria-labelledby", "tab-" + state.page);
        document.getElementById("decisionBand").innerHTML = decisionReadout();
        renderKpis();
        renderVisuals();
        enhanceChartKeyboard();
        markScrollableTables();
        publishQa();
        fitDashboard();
        if (announce) {
          document.getElementById("srStatus").textContent = announce + ". " + page.label + " updated.";
        }
      }

      function interactiveFocusIndex(type, value, source) {
        var nodes = Array.prototype.filter.call(document.querySelectorAll("[data-" + type + "]"), function (node) {
          return node.getAttribute("data-" + type) === value;
        });
        return Math.max(0, nodes.indexOf(source));
      }

      function restoreInteractiveFocus(type, value, index) {
        if (index == null) return;
        requestAnimationFrame(function () {
          var nodes = Array.prototype.filter.call(document.querySelectorAll("[data-" + type + "]"), function (node) {
            return node.getAttribute("data-" + type) === value;
          });
          var target = nodes[Math.min(index, Math.max(0, nodes.length - 1))];
          if (target) target.focus();
        });
      }

      function setScenario(value, announce, focusIndex) {
        if (!scenarioProfile[value] || state.page === "scenario-lab") return;
        state.scenario = value;
        document.getElementById("scenarioFilter").value = value;
        render(announce || "Scenario set to " + value);
        restoreInteractiveFocus("scenario", value, focusIndex);
      }

      function setContext(type, value, focusIndex) {
        var nextValue = value;
        if (type === "service" && serviceProfile[value]) {
          nextValue = state.service === value ? "All Services" : value;
          state.service = nextValue;
        }
        if (type === "department" && departmentProfile[value]) {
          nextValue = state.department === value ? "All Departments" : value;
          state.department = nextValue;
        }
        if (type === "region" && regionProfile[value]) {
          nextValue = state.region === value ? "All Regions" : value;
          state.region = nextValue;
          document.getElementById("regionFilter").value = nextValue;
        }
        render((type === "service" ? "Service" : type === "department" ? "Department" : "Region") + " set to " + nextValue);
        restoreInteractiveFocus(type, value, focusIndex);
      }

      function reset() {
        var currentPage = state.page;
        state = Object.assign({}, defaults);
        state.page = currentPage;
        document.getElementById("scenarioFilter").value = state.scenario;
        document.getElementById("yearFilter").value = state.year;
        document.getElementById("regionFilter").value = state.region;
        render("Planning lens reset");
      }

      function refreshScenarioLab(announce) {
        hideTooltip();
        document.getElementById("decisionBand").innerHTML = decisionReadout();
        renderKpis();
        var staging = document.createElement("div");
        staging.innerHTML = renderLab();
        var nextPanels = Array.prototype.slice.call(staging.children);
        var root = document.getElementById("visuals");
        var currentSummary = root.querySelector(".summary-grid");
        var nextSummary = nextPanels[0] && nextPanels[0].querySelector(".summary-grid");
        if (currentSummary && nextSummary) currentSummary.replaceWith(nextSummary);
        while (root.children.length > 1) root.removeChild(root.lastElementChild);
        nextPanels.slice(1).forEach(function (panelNode) { root.appendChild(panelNode); });
        enhanceChartKeyboard();
        markScrollableTables();
        publishQa();
        fitDashboard();
        if (announce) document.getElementById("srStatus").textContent = announce + ". Scenario Lab updated.";
      }

      function placeTooltip(tooltip, left, top) {
        var margin = 12;
        tooltip.style.left = Math.min(window.innerWidth - tooltip.offsetWidth - margin, Math.max(margin, left)) + "px";
        tooltip.style.top = Math.min(window.innerHeight - tooltip.offsetHeight - margin, Math.max(margin, top)) + "px";
      }

      function positionTooltip(event, text) {
        var tooltip = document.getElementById("tooltip");
        tooltip.textContent = text;
        tooltip.classList.add("visible");
        var gap = 12;
        var top = event.clientY + gap;
        if (top + tooltip.offsetHeight > window.innerHeight - 12) top = event.clientY - tooltip.offsetHeight - gap;
        placeTooltip(tooltip, event.clientX + gap, top);
      }

      function positionTooltipForTarget(target, text) {
        var tooltip = document.getElementById("tooltip");
        tooltip.textContent = text;
        tooltip.classList.add("visible");
        var rect = target.getBoundingClientRect();
        var gap = 10;
        var margin = 12;
        var candidates = [
          { left: rect.right + gap, top: rect.top + rect.height / 2 - tooltip.offsetHeight / 2 },
          { left: rect.left - tooltip.offsetWidth - gap, top: rect.top + rect.height / 2 - tooltip.offsetHeight / 2 },
          { left: rect.left + rect.width / 2 - tooltip.offsetWidth / 2, top: rect.top - tooltip.offsetHeight - gap },
          { left: rect.left + rect.width / 2 - tooltip.offsetWidth / 2, top: rect.bottom + gap }
        ];
        var choice = candidates.find(function (candidate) {
          return candidate.left >= margin && candidate.top >= margin && candidate.left + tooltip.offsetWidth <= window.innerWidth - margin && candidate.top + tooltip.offsetHeight <= window.innerHeight - margin;
        }) || candidates[2];
        placeTooltip(tooltip, choice.left, choice.top);
      }

      function hideTooltip() {
        document.getElementById("tooltip").classList.remove("visible");
      }

      function nearestChartMark(chart, clientX, clientY) {
        var marks = chartMarks(chart);
        var nearest = null;
        var distance = Infinity;
        marks.forEach(function (mark, index) {
          var rect = mark.getBoundingClientRect();
          var dx = clientX - (rect.left + rect.width / 2);
          var dy = clientY - (rect.top + rect.height / 2);
          var nextDistance = dx * dx + dy * dy;
          if (nextDistance < distance) {
            distance = nextDistance;
            nearest = { mark: mark, index: index };
          }
        });
        return nearest;
      }

      function setInlineBarReadout(target, announce) {
        var list = target.closest(".bar-list");
        var readout = list ? list.querySelector(".bar-readout") : null;
        var text = target.getAttribute("data-inline-tip");
        if (readout) readout.textContent = text;
        if (announce) document.getElementById("srStatus").textContent = text;
        hideTooltip();
      }

      document.getElementById("dashboard").addEventListener("click", function (event) {
        var pageButton = event.target.closest("button[data-page]");
        var scenarioButton = event.target.closest("[data-scenario]");
        var serviceButton = event.target.closest("[data-service]");
        var departmentButton = event.target.closest("[data-department]");
        var regionButton = event.target.closest("[data-region]");
        var inlineBar = event.target.closest("[data-inline-tip]");
        if (pageButton) {
          state.page = pageButton.getAttribute("data-page");
          if (state.page === "scenario-lab") state.scenario = "Base";
          render("Page changed");
        } else if (scenarioButton) {
          var scenarioValue = scenarioButton.getAttribute("data-scenario");
          setScenario(scenarioValue, "", interactiveFocusIndex("scenario", scenarioValue, scenarioButton));
        } else if (serviceButton) {
          var serviceValue = serviceButton.getAttribute("data-service");
          setContext("service", serviceValue, interactiveFocusIndex("service", serviceValue, serviceButton));
        } else if (departmentButton) {
          var departmentValue = departmentButton.getAttribute("data-department");
          setContext("department", departmentValue, interactiveFocusIndex("department", departmentValue, departmentButton));
        } else if (regionButton) {
          var regionValue = regionButton.getAttribute("data-region");
          setContext("region", regionValue, interactiveFocusIndex("region", regionValue, regionButton));
        } else if (inlineBar) {
          setInlineBarReadout(inlineBar, true);
        } else {
          var chart = event.target.closest("svg[data-keyboard-chart]");
          if (chart) {
            var nearest = nearestChartMark(chart, event.clientX, event.clientY);
            if (nearest) setChartActiveMark(chart, nearest.index, true);
          }
        }
      });

      document.getElementById("dashboard").addEventListener("keydown", function (event) {
        var target = event.target;
        if (target.matches("[role='tab']") && ["ArrowRight", "ArrowLeft", "Home", "End"].indexOf(event.key) >= 0) {
          event.preventDefault();
          var tabs = Array.prototype.slice.call(document.querySelectorAll("[role='tab']"));
          var index = tabs.indexOf(target);
          if (event.key === "ArrowRight") index = (index + 1) % tabs.length;
          if (event.key === "ArrowLeft") index = (index - 1 + tabs.length) % tabs.length;
          if (event.key === "Home") index = 0;
          if (event.key === "End") index = tabs.length - 1;
          tabs[index].click();
          requestAnimationFrame(function () {
            var active = document.querySelector("[role='tab'][aria-selected='true']");
            if (active) active.focus();
          });
        } else if (target.matches("svg[data-keyboard-chart]") && ["ArrowRight", "ArrowLeft", "ArrowUp", "ArrowDown", "Home", "End"].indexOf(event.key) >= 0) {
          event.preventDefault();
          var marks = chartMarks(target);
          var markIndex = Number(target.dataset.activeMark || 0);
          if (event.key === "ArrowRight" || event.key === "ArrowDown") markIndex = (markIndex + 1) % marks.length;
          if (event.key === "ArrowLeft" || event.key === "ArrowUp") markIndex = (markIndex - 1 + marks.length) % marks.length;
          if (event.key === "Home") markIndex = 0;
          if (event.key === "End") markIndex = marks.length - 1;
          setChartActiveMark(target, markIndex, true);
        } else if ((event.key === "Enter" || event.key === " ") && target.closest("[data-scenario]")) {
          event.preventDefault();
          var scenarioTarget = target.closest("[data-scenario]");
          var scenarioKeyValue = scenarioTarget.getAttribute("data-scenario");
          setScenario(scenarioKeyValue, "", interactiveFocusIndex("scenario", scenarioKeyValue, scenarioTarget));
        } else if ((event.key === "Enter" || event.key === " ") && target.closest("[data-service]")) {
          event.preventDefault();
          var serviceTarget = target.closest("[data-service]");
          var serviceKeyValue = serviceTarget.getAttribute("data-service");
          setContext("service", serviceKeyValue, interactiveFocusIndex("service", serviceKeyValue, serviceTarget));
        } else if ((event.key === "Enter" || event.key === " ") && target.closest("[data-department]")) {
          event.preventDefault();
          var departmentTarget = target.closest("[data-department]");
          var departmentKeyValue = departmentTarget.getAttribute("data-department");
          setContext("department", departmentKeyValue, interactiveFocusIndex("department", departmentKeyValue, departmentTarget));
        } else if ((event.key === "Enter" || event.key === " ") && target.closest("[data-region]")) {
          event.preventDefault();
          var regionTarget = target.closest("[data-region]");
          var regionKeyValue = regionTarget.getAttribute("data-region");
          setContext("region", regionKeyValue, interactiveFocusIndex("region", regionKeyValue, regionTarget));
        }
      });

      ["scenario", "year", "region"].forEach(function (key) {
        document.getElementById(key + "Filter").addEventListener("change", function (event) {
          state[key] = event.target.value;
          render(key.charAt(0).toUpperCase() + key.slice(1) + " set to " + state[key]);
        });
      });

      document.getElementById("contextFilter").addEventListener("change", function (event) {
        var mode = contextMode();
        state[mode] = event.target.value;
        render((mode === "service" ? "Service" : "Department") + " set to " + event.target.value);
      });

      document.getElementById("resetFilters").addEventListener("click", reset);

      document.getElementById("dashboard").addEventListener("input", function (event) {
        var control = event.target.closest("[data-control]");
        if (!control) return;
        var key = control.getAttribute("data-control");
        state[key] = Number(control.value);
        var output = control.parentElement.querySelector("output");
        if (output) output.textContent = (state[key] > 0 ? "+" : "") + state[key] + (key === "dso" ? "d" : "%");
        refreshScenarioLab(control.getAttribute("aria-label") + " adjusted");
      });

      document.getElementById("dashboard").addEventListener("mousemove", function (event) {
        var chart = event.target.closest("svg[data-inline-readout='true']");
        if (chart) {
          var marks = chartMarks(chart);
          if (marks.length) {
            var nearest = nearestChartMark(chart, event.clientX, event.clientY);
            if (nearest) setChartActiveMark(chart, nearest.index, false);
          } else {
            var chartTarget = event.target.closest("[data-tip]");
            if (chartTarget && chart.contains(chartTarget)) setChartReadout(chart, chartTarget.getAttribute("data-tip"), false);
          }
          return;
        }
        var inlineTarget = event.target.closest("[data-inline-tip]");
        if (inlineTarget) {
          setInlineBarReadout(inlineTarget, false);
          return;
        }
        var target = event.target.closest("[data-tip]");
        if (target) positionTooltip(event, target.getAttribute("data-tip"));
        else hideTooltip();
      });
      document.getElementById("dashboard").addEventListener("mouseleave", hideTooltip);
      document.getElementById("dashboard").addEventListener("focusin", function (event) {
        var inlineTarget = event.target.closest("[data-inline-tip]");
        if (inlineTarget) {
          setInlineBarReadout(inlineTarget, true);
          return;
        }
        var target = event.target.closest("[data-tip]");
        if (target) {
          var readoutChart = target.closest("svg[data-inline-readout='true']");
          if (readoutChart) {
            setChartReadout(readoutChart, target.getAttribute("data-tip"), false);
            return;
          }
          positionTooltipForTarget(target, target.getAttribute("data-tip"));
          return;
        }
        var chart = event.target.closest("svg[data-keyboard-chart]");
        if (chart) setChartActiveMark(chart, Number(chart.dataset.activeMark || 0), false);
      });
      document.getElementById("dashboard").addEventListener("focusout", function (event) {
        var chart = event.target.closest("svg[data-keyboard-chart]");
        if (chart) chartMarks(chart).forEach(function (mark) { mark.classList.remove("keyboard-active"); });
        hideTooltip();
      });
      window.addEventListener("resize", fitDashboard);

      window.previewActions = {
        setPage: function (id) {
          if (pages.some(function (page) { return page.id === id; })) {
            state.page = id;
            if (id === "scenario-lab") state.scenario = "Base";
            render("Page changed");
          }
          return window.previewState;
        },
        setFilter: function (kind, value) {
          if (["scenario", "year", "region"].indexOf(kind) >= 0) {
            state[kind] = value;
            var element = document.getElementById(kind + "Filter");
            if (element) element.value = value;
          } else if (kind === "service" && serviceProfile[value]) {
            state.service = value;
          } else if (kind === "department" && departmentProfile[value]) {
            state.department = value;
          } else if (["volume", "rate", "cost", "dso"].indexOf(kind) >= 0) {
            state[kind] = Number(value);
          }
          render(kind + " updated");
          return window.previewState;
        },
        resetFilters: function () {
          reset();
          return window.previewState;
        },
        getSummary: function () {
          return compute();
        },
        getRows: function () {
          return Array.prototype.map.call(document.querySelectorAll("tbody tr"), function (row) { return row.innerText.trim(); });
        },
        getChartFingerprint: function () {
          return window.__dashboardQa.chartFingerprint;
        }
      };

      render();
    })();
  </script>
</body>
