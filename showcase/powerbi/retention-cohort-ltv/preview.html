<script>
(function(){

 ];

 var base={active:812,repeat:92.5,revenue:98700,churn:1241,m1:39.7,m3:35.8,m6:32.1,ltv:428,cac:104};
 var ids=["year","channel","region","plan"];
 function factor(){var n=1;if(state.year==="2025")n*=.91;if(state.channel==="Organic")n*=.74;else if(state.channel==="Paid Search")n*=.64;else if(state.channel==="Email")n*=.42;else if(state.channel==="Affiliate")n*=.28;if(state.region==="South")n*=.61;else if(state.region==="North")n*=.82;else if(state.region==="Central")n*=.34;if(state.plan==="Premium")n*=.43;else if(state.plan==="Standard")n*=.38;else if(state.plan==="Basic")n*=.19;return n}

 function spark(vals,c){var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals),p=vals.map(function(v,i){return (3+i*14)+","+(34-(v-lo)/(hi-lo||1)*28)}).join(" ");return '<svg class="spark" viewBox="0 0 78 38"><polyline points="'+p+'" fill="none" stroke="'+c+'" stroke-width="3"/></svg>'}
 function metrics(){var f=factor(),adj=retentionAdjustment(),repeat=Math.max(70,Math.min(98,base.repeat+adj)),m1=base.m1+adj*.35,m3=base.m3+adj*.45,m6=base.m6+adj*.55,defaultLens=ids.every(function(id){return state[id]===({year:"2026",channel:"All Channels",region:"All Regions",plan:"All Plans"})[id]});if(state.page==="monthly-cohort-retention")return[{l:"M1 retention",v:m1.toFixed(1)+"%",d:"After first purchase month",c:"#2f80ed"},{l:"M3 retention",v:m3.toFixed(1)+"%",d:(m1-m3).toFixed(1)+" pts below M1",c:"#09a7a2"},{l:"M6 retention",v:m6.toFixed(1)+"%",d:(m3-m6).toFixed(1)+" pts below M3",c:"#18a05e"},{l:"Latest cohort",v:Math.round(113*f).toLocaleString(),d:"New customers · May",c:"#ee9b00"}];if(state.page==="ltv-revenue-cohorts"){var ltv=base.ltv*(1+adj/100),ratio=ltv/base.cac;return[{l:"Customer LTV",v:"$"+Math.round(ltv),d:"12-month modeled value",c:"#2f80ed"},{l:"LTV / CAC",v:ratio.toFixed(1)+"x",d:(ratio-3).toFixed(1)+"x above 3.0x hurdle",c:"#09a7a2"},{l:"Cohort revenue",v:"$"+Math.round(base.revenue*f/1000)+"K",d:"Selected customer lens",c:"#7143ff"},{l:"Payback",v:"4.1 mo",d:"1.9 mo inside hurdle",c:"#ee9b00"}]}if(state.page==="churn-signal-winback")return[{l:"High-risk customers",v:Math.round(base.churn*f*(1-adj/100)).toLocaleString(),d:defaultLens?"+9.3% vs Apr":"Filtered risk pool",c:"#e3444f",risk:true},{l:"Revenue at risk",v:"$"+Math.round(168*f)+"K",d:"Next 90 days",c:"#e3444f",risk:true},{l:"Winback potential",v:"$"+Math.round(92*f)+"K",d:"Modeled, non-additive",c:"#18a05e"},{l:"Action coverage",v:Math.max(55,78+adj).toFixed(0)+"%",d:"6 pts above prior month",c:"#2f80ed"}];return[{l:"Active customers",v:Math.round(base.active*f).toLocaleString(),d:defaultLens?"+3 vs Apr":"Selected customer lens",c:"#2f80ed"},{l:"Repeat purchase",v:repeat.toFixed(1)+"%",d:"Eligible repeat customers",c:"#18a05e"},{l:"Net revenue",v:"$"+Math.round(base.revenue*f/1000)+"K",d:defaultLens?"$98,700 · +2.0% vs Apr":"Selected customer lens",c:"#7143ff"},{l:"Churn signals",v:Math.round(base.churn*f*(1-adj/100)).toLocaleString(),d:defaultLens?"+9.3% vs Apr":"Filtered risk pool",c:"#e3444f",risk:true}]}
 function lifecycle(){var f=factor(),adj=retentionAdjustment(),newCustomers=[110,156,128,142,133,151,120,148,126,154,132,145].map(function(v){return v*f}),returning=[610,636,622,651,640,663,646,676,661,687,698,699].map(function(v){return v*f}),repeat=[88,91,90,92,89,94,90,93,95,92,94,92.5].map(function(v){return Math.max(70,Math.min(99,v+adj))});return '<article class="panel"><h3>New vs Returning Customers</h3><div class="sub">Shared 0–800 customer scale; selected lens changes both series</div>'+chartSvg(newCustomers,returning,"New","Returning",[0,800])+'</article><article class="panel"><h3>Repeat Purchase Rate</h3><div class="sub">Share of eligible customers with 2+ lifetime purchases</div>'+chartSvg(repeat,null,"Repeat rate","",[70,100])+'</article><article class="panel wide"><h3>Monthly Lifecycle Reconciliation</h3><div class="sub">Active = new + returning; repeat rate uses the eligible repeat population</div>'+detailTable(false)+'</article>'}
 function cohortCurve(vals){var adj=retentionAdjustment();return vals.map(function(v,i){return i===0?v:Math.max(0,Math.min(100,v+adj*(.31+i*.04)))})}

 function heatmap(){var rows=["May 2026","Apr 2026","Mar 2026","Feb 2026","Jan 2026","Dec 2025","Nov 2025","Oct 2025","Sep 2025","Aug 2025"];var html='<div class="heat"><b></b>'+["M0","M1","M2","M3","M4","M5","M6","M7","M8","M9"].map(function(x){return "<b>"+x+"</b>"}).join("");rows.forEach(function(r,ri){html+="<b>"+r+"</b>";for(var i=0;i<10;i++){html+=i<=ri?'<span class="'+(i===0?"strong":"")+'">'+(i===0?100:Math.max(19,49-i*3-ri%4))+'%</span>':'<span style="background:transparent"></span>'}});return html+"</div>"}
 function detailTable(risk){var f=factor(),adj=retentionAdjustment(),raw=risk?[["C-1042","High","$8,420","Winback offer"],["C-1108","High","$6,980","Priority call"],["C-1217","Medium","$5,420","Lifecycle email"],["C-1321","Medium","$4,780","Plan review"]]:[["May 2026",812,113,699,92.5,98700],["Apr 2026",809,111,698,92.3,96717],["Mar 2026",793,121,672,91.0,99745],["Jan 2026",698,142,556,89.7,88970]],rows=risk?raw:raw.map(function(r){return[r[0],Math.round(r[1]*f).toLocaleString(),Math.round(r[2]*f).toLocaleString(),Math.round(r[3]*f).toLocaleString(),Math.max(70,r[4]+adj).toFixed(1)+"%","$"+Math.round(r[5]*f).toLocaleString()]});return '<table><thead><tr>'+((risk?["Customer","Risk","LTV","Next action"]:["Month","Active","New","Returning","Repeat rate","Revenue"]).map(function(x){return "<th>"+x+"</th>"}).join(""))+'</tr></thead><tbody>'+rows.map(function(r){return "<tr>"+r.map(function(x,i){return '<td class="'+(risk&&i===1?"risk":"")+'">'+x+"</td>"}).join("")+"</tr>"}).join("")+"</tbody></table>"}
 function render(){
  var p=pages.filter(function(x){return x.id===state.page})[0],m=metrics(),f=factor();
  document.getElementById("pageTitle").textContent=p.title;document.getElementById("currentLens").textContent=(state.page==="monthly-cohort-retention"?"All cohorts":"Jan 2024–May 2026")+" | "+state.year+" | "+state.channel+" | "+state.region+" | "+state.plan;
  document.getElementById("pageNav").innerHTML=pages.map(function(x){var active=x.id===state.page;return '<button type="button" data-page="'+x.id+'" aria-current="'+(active?"page":"false")+'" aria-pressed="'+active+'" class="'+(active?"active":"")+'">'+x.label+'</button>'}).join("");
  var kpiRegion=document.getElementById("kpis");kpiRegion.setAttribute("aria-live","polite");kpiRegion.innerHTML=m.map(function(x,i){return '<article class="kpi '+(x.risk?"risk":"")+'" aria-label="'+x.l+': '+x.v+', '+x.d+'"><div class="kpi-head"><span>'+x.l+'</span>'+spark([1+i,2+i,2.5+i,4+i,5+i],x.c)+'</div><strong style="color:'+x.c+'">'+x.v+'</strong><small>'+x.d+'</small></article>'}).join("");

  else if(state.page==="ltv-revenue-cohorts")v.innerHTML='<article class="panel"><h3>Cumulative LTV curves</h3><div class="sub">May and April cohorts on a shared fixed $0–$520 scale</div>'+chartSvg(ltvCurve([20,50,90,140,195,255,315,370,420,465]),ltvCurve([18,43,78,123,170,219,270,318,361,400]),"May cohort","April cohort",[0,520])+'</article><article class="panel"><h3>LTV by acquisition channel</h3><div class="sub">Select a channel to cross-filter the cohort view</div><div class="bands">'+[["Organic",420],["Email",360],["Paid Search",280],["Affiliate",210]].map(function(r){var selected=state.channel===r[0],adjusted=Math.round(r[1]*(1+retentionAdjustment()/100));return '<button type="button" data-channel="'+r[0]+'" aria-pressed="'+selected+'" class="'+(selected?"selected":"")+'" style="height:'+Math.max(24,Math.round(adjusted/3))+'px" aria-label="Filter to '+r[0]+', modeled LTV $'+adjusted+'">$'+adjusted+'<br><small>'+r[0]+'</small></button>'}).join("")+'</div></article><article class="panel wide"><h3>Cohort value detail</h3><div class="sub">LTV / CAC remains above the 3.0x investment hurdle</div>'+detailTable(false)+'</article>';
  else {var riskScale=Math.max(.08,Math.pow(f,.32)*(1-retentionAdjustment()/100)),riskSeries=[20,35,48,65,82,98,118,141,165,190].map(function(x){return x*riskScale});v.innerHTML='<article class="panel"><h3>Risk band distribution</h3><div class="sub">Customer count by churn signal; bar heights use a fixed portfolio scale</div><div class="bands">'+[["Low",420],["Watch",310],["High",190],["Critical",105]].map(function(r){var value=Math.round(r[1]*f);return '<span style="height:'+Math.max(24,Math.round(r[1]*f/3))+'px">'+r[0]+'<br>'+value+'</span>'}).join("")+'</div></article><article class="panel"><h3>Recency vs lifetime value</h3><div class="sub">Risk index uses the same fixed 0–210 portfolio scale</div>'+chartSvg(riskSeries,null,"Risk index","",[0,210])+'</article><article class="panel wide"><h3>At-risk customer action queue</h3><div class="sub">Synthetic customer keys, expected value, and next action</div>'+detailTable(true)+'</article>'}

 }
